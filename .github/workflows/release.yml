name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: Run quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

  package-windows:
    name: Package Windows app (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 30
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Windows portable app
        run: pnpm package:win:${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: astra-browser-windows-${{ matrix.arch }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: Package macOS app (${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 30
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package macOS apps
        run: pnpm package:mac:${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: astra-browser-macos-${{ matrix.arch }}-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: astra-browser-macos-${{ matrix.arch }}-zip
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Package Linux app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Linux apps
        run: pnpm package:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: astra-browser-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - package-windows
      - package-macos
      - package-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG_NAME:-$REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          expected_tag="v$version"

          if [ "$tag" != "$expected_tag" ]; then
            echo "Release tag '$tag' does not match package version '$version'. Expected '$expected_tag'." >&2
            exit 1
          fi

          mapfile -t assets < <(find release-assets -type f | sort)
          if [ "${#assets[@]}" -lt 6 ]; then
            echo "Expected release assets for Windows, macOS, and Linux, found ${#assets[@]}." >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          title="Astra Browser $version"
          notes="Multi-platform builds for Astra Browser $version: Windows portable executables, macOS DMG/ZIP packages, and Linux AppImage/DEB/tar.gz packages."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          fi
