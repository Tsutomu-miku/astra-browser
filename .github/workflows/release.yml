name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Release Windows executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Package Windows portable exe
        run: pnpm package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path Variable:\PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          function Invoke-GitHubCli {
            & gh @args
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub CLI command failed: gh $args"
            }
          }

          $tag = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:INPUT_TAG_NAME } else { $env:REF_NAME }
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"

          if ($tag -ne $expectedTag) {
            throw "Release tag '$tag' does not match package version '$version'. Expected '$expectedTag'."
          }

          $assets = Get-ChildItem -Path release -Filter "*.exe"
          if ($assets.Count -ne 1) {
            throw "Expected exactly one Windows exe in release/, found $($assets.Count)."
          }

          $assetPath = $assets[0].FullName
          $title = "Astra Browser $version"
          $notes = "Windows x64 portable build for Astra Browser $version."

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Invoke-GitHubCli release upload $tag $assetPath --clobber
          } else {
            Invoke-GitHubCli release create $tag $assetPath --title $title --notes $notes --target $env:GITHUB_SHA
          }
