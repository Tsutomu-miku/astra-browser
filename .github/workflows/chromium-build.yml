name: Astra Chromium Build

on:
  push:
    branches:
      - chromium-native
    paths:
      - 'chromium/astra/**'
      - 'scripts/chromium-bootstrap.sh'
      - 'scripts/sync-overlay.sh'
      - 'scripts/apply-patches.sh'
      - 'scripts/build-astra.sh'
      - '.github/workflows/chromium-build.yml'
  pull_request:
    branches:
      - chromium-native
    paths:
      - 'chromium/astra/**'
      - 'scripts/chromium-bootstrap.sh'
      - 'scripts/sync-overlay.sh'
      - 'scripts/apply-patches.sh'
      - 'scripts/build-astra.sh'
      - '.github/workflows/chromium-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ========================================================================
  # Job 1: Architecture & Source Validation (Linux)
  # ========================================================================
  # Lightweight checks that run on every PR/push to chromium-native.
  # Validates that the Astra code follows the direct Chromium architecture
  # contract defined in AGENTS.md.
  # ========================================================================
  validate-linux:
    name: Validate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run architecture guard
        run: pnpm check:architecture

      - name: Verify header guards
        run: |
          set -euo pipefail
          errors=0
          astra_dir="chromium/astra"

          if [ ! -d "$astra_dir" ]; then
            echo "No chromium/astra directory found — skipping header guard check."
            exit 0
          fi

          while IFS= read -r -d '' file; do
            relpath="${file#chromium/}"
            expected="$(echo "$relpath" | tr '[:lower:]' '[:upper:]' | sed 's/[^A-Z0-9]/_/g; s/_H$/_H_/')"

            ifndef="$(grep -m1 '^#ifndef ' "$file" | awk '{print $2}')"
            if [ -z "$ifndef" ]; then
              echo "::error file=$file::Missing #ifndef header guard"
              errors=$((errors + 1))
              continue
            fi

            if [ "$ifndef" != "$expected" ]; then
              echo "::error file=$file::Header guard mismatch: expected '$expected', got '$ifndef'"
              errors=$((errors + 1))
            fi
          done < <(find "$astra_dir" -name '*.h' -print0)

          echo "Checked $(find "$astra_dir" -name '*.h' | wc -l) header files."
          echo "Errors: $errors"

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi

      - name: Verify BUILD.gn completeness
        run: |
          set -euo pipefail
          astra_dir="chromium/astra"

          if [ ! -d "$astra_dir" ]; then
            echo "No chromium/astra directory found — skipping BUILD.gn check."
            exit 0
          fi

          if [ -f "scripts/check-build-gn.mjs" ]; then
            node scripts/check-build-gn.mjs
          else
            echo "scripts/check-build-gn.mjs not found — running basic check."
            errors=0
            total_files=0
            while IFS= read -r build_gn; do
              gn_dir="$(dirname "$build_gn")"
              disk_files=$(find "$gn_dir" -maxdepth 1 -type f \( -name '*.cc' -o -name '*.h' \) | xargs -n1 basename 2>/dev/null | sort)
              gn_files=$(grep -A999 'sources = \[' "$build_gn" | grep -m1 -B999 '^\]' | grep -o '"[^"]*\.(cc|h)"' | tr -d '"' | sort)
              count=$(echo "$gn_files" | grep -c . || true)
              echo "  $build_gn: $count source(s) listed"
              total_files=$((total_files + count))
            done < <(find "$astra_dir" -name 'BUILD.gn')
            echo "Total BUILD.gn source entries: $total_files"
          fi

      - name: Validate patch files
        run: |
          set -euo pipefail
          patch_dir="chromium/astra/patches"

          if [ ! -d "$patch_dir" ]; then
            echo "No patches directory found — skipping patch validation."
            exit 0
          fi

          errors=0
          warnings=0

          for patch in "$patch_dir"/*.patch; do
            [ -f "$patch" ] || continue
            basename_patch="$(basename "$patch" .patch)"

            md_file="$patch_dir/$basename_patch.md"
            if [ ! -f "$md_file" ]; then
              echo "::error file=$patch::Patch has no corresponding .md documentation"
              errors=$((errors + 1))
            fi

            if ! head -5 "$patch" | grep -qE '^(diff |\+\+\+ |--- )'; then
              echo "::warning file=$patch::Patch may not be in standard format"
              warnings=$((warnings + 1))
            fi
          done

          echo "Patches found: $(find "$patch_dir" -name '*.patch' | wc -l)"
          echo "Errors: $errors"
          echo "Warnings: $warnings"

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi

  # ========================================================================
  # Job 2: Architecture & Source Validation (Windows)
  # ========================================================================
  # Runs architecture validation on Windows to ensure cross-platform
  # consistency of checks and source code.
  # ========================================================================
  validate-windows:
    name: Validate (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run architecture guard
        run: pnpm check:architecture

      - name: Count source files
        run: |
          $count = (Get-ChildItem -Path "chromium/astra" -Recurse -Filter "*.cc" | Measure-Object).Count
          $headers = (Get-ChildItem -Path "chromium/astra" -Recurse -Filter "*.h" | Measure-Object).Count
          Write-Output "Source files: $count"
          Write-Output "Header files: $headers"
          Write-Output "Total: $($count + $headers)"

      - name: Verify BUILD.gn files exist
        run: |
          $buildGns = Get-ChildItem -Path "chromium/astra" -Recurse -Filter "BUILD.gn"
          Write-Output "BUILD.gn files found: $($buildGns.Count)"
          foreach ($gn in $buildGns) {
            Write-Output "  - $($gn.FullName.Replace($env:GITHUB_WORKSPACE + '\', ''))"
          }

  # ========================================================================
  # Job 3: Build Documentation & Badges
  # ========================================================================
  # Generates build status badges and validates documentation.
  # ========================================================================
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-linux, validate-windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify BUILD.md exists
        run: |
          if [ -f "docs/BUILD.md" ]; then
            echo "docs/BUILD.md found."
            echo "Lines: $(wc -l < docs/BUILD.md)"
          else
            echo "::warning::docs/BUILD.md not found"
          fi

      - name: Generate build status badge (Linux validation)
        run: |
          mkdir -p artifacts/badges
          cat > artifacts/badges/validate-linux.svg << 'BADGE'
          <svg xmlns="http://www.w3.org/2000/svg" width="140" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="a">
              <rect width="140" height="20" rx="3" fill="#fff"/>
            </mask>
            <g mask="url(#a)">
              <path fill="#555" d="M0 0h70v20H0z"/>
              <path fill="#4c1" d="M70 0h70v20H70z"/>
              <path fill="url(#b)" d="M0 0h140v20H0z"/>
            </g>
            <g fill="#fff" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="110">
              <text x="360" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="600">validate</text>
              <text x="360" y="140" transform="scale(.1)" textLength="600">validate</text>
              <text x="1050" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="600">linux</text>
              <text x="1050" y="140" transform="scale(.1)" textLength="600">linux</text>
            </g>
          </svg>
          BADGE

      - name: Generate Windows validation badge
        run: |
          cat > artifacts/badges/validate-windows.svg << 'BADGE'
          <svg xmlns="http://www.w3.org/2000/svg" width="160" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="a">
              <rect width="160" height="20" rx="3" fill="#fff"/>
            </mask>
            <g mask="url(#a)">
              <path fill="#555" d="M0 0h70v20H0z"/>
              <path fill="#4c1" d="M70 0h90v20H70z"/>
              <path fill="url(#b)" d="M0 0h160v20H0z"/>
            </g>
            <g fill="#fff" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="110">
              <text x="360" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="600">validate</text>
              <text x="360" y="140" transform="scale(.1)" textLength="600">validate</text>
              <text x="1150" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="800">windows</text>
              <text x="1150" y="140" transform="scale(.1)" textLength="800">windows</text>
            </g>
          </svg>
          BADGE

      - name: Document build prerequisites summary
        run: |
          if [ -f "docs/BUILD.md" ]; then
            echo "=== Build Prerequisites Summary ==="
            echo ""
            grep -E '^(## |### |- |\* )' docs/BUILD.md | head -40 || true
          fi

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-docs
          path: artifacts/badges/
          if-no-files-found: ignore
          retention-days: 14

  # ========================================================================
  # Job 4: Linux Self-hosted Build
  # ========================================================================
  # Full Chromium build on a Linux self-hosted runner with the
  # 'astra-chromium-builder' label.  This job stays queued if no
  # self-hosted runner is available.
  # ========================================================================
  build-linux:
    name: Build (Linux)
    runs-on:
      - self-hosted
      - astra-chromium-builder
      - linux
    timeout-minutes: 480
    needs: [validate-linux, validate-windows]

    env:
      DEPOT_TOOLS_DIR: ${{ github.workspace }}/third_party/depot_tools
      CHROMIUM_SRC: ${{ github.workspace }}/chromium/src
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: third_party/depot_tools
          key: ${{ runner.os }}-depot-tools

      - name: Cache Chromium checkout
        uses: actions/cache@v4
        with:
          path: chromium/src
          key: ${{ runner.os }}-chromium-src-${{ hashFiles('scripts/chromium-bootstrap.sh') }}
          restore-keys: |
            ${{ runner.os }}-chromium-src-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            chromium/src/out/astra_Debug
            chromium/src/out/astra_Release
          key: ${{ runner.os }}-chromium-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-chromium-build-

      - name: Bootstrap Chromium
        run: |
          chmod +x scripts/chromium-bootstrap.sh
          ./scripts/chromium-bootstrap.sh --no-sync

      - name: Sync Astra overlay
        run: |
          chmod +x scripts/sync-overlay.sh
          ./scripts/sync-overlay.sh

      - name: Apply Astra patches
        run: |
          chmod +x scripts/apply-patches.sh
          ./scripts/apply-patches.sh --list
          ./scripts/apply-patches.sh

      - name: Build Astra Chromium (Debug)
        run: |
          chmod +x scripts/build-astra.sh
          ./scripts/build-astra.sh --target chrome --jobs $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

      - name: Run unit tests
        run: |
          cd chromium/src
          if command -v autoninja >/dev/null 2>&1; then
            autoninja -C out/astra_Debug astra_unittests
            ./out/astra_Debug/astra_unittests || echo "Note: Some test failures may be expected in CI"
          else
            echo "autoninja not available — skipping tests"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-chromium-debug-linux
          path: |
            chromium/src/out/astra_Debug/chrome
            chromium/src/out/astra_Debug/*.app
          if-no-files-found: ignore
          retention-days: 7

  # ========================================================================
  # Job 5: Windows Self-hosted Build
  # ========================================================================
  # Full Chromium build on a Windows self-hosted runner with the
  # 'astra-chromium-builder' label.
  #
  # Windows build requirements:
  #   - Visual Studio 2022 (17.0+) with Desktop development with C++
  #   - Windows 10 SDK (10.0.19041.0 or later)
  #   - Git for Windows (Git Bash)
  #   - Python 3.8+
  #   - ~100 GB free disk space
  # ========================================================================
  build-windows:
    name: Build (Windows)
    runs-on:
      - self-hosted
      - astra-chromium-builder
      - windows
    timeout-minutes: 480
    needs: [validate-linux, validate-windows]

    env:
      DEPOT_TOOLS_DIR: ${{ github.workspace }}\third_party\depot_tools
      CHROMIUM_SRC: ${{ github.workspace }}\chromium\src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          # Verify Git Bash is available
          if (Get-Command bash -ErrorAction SilentlyContinue) {
            bash --version
            Write-Output "Git Bash is available."
          } else {
            Write-Output "::warning::Git Bash not found in PATH. Some scripts may not work."
          }

          # Verify Python
          if (Get-Command python -ErrorAction SilentlyContinue) {
            python --version
          }

          # Check free disk space
          $disk = Get-PSDrive C
          $freeGB = [math]::Round($disk.Free / 1GB, 2)
          Write-Output "Free disk space (C:): $freeGB GB"
          if ($freeGB -lt 80) {
            Write-Output "::warning::Low disk space. Chromium builds require ~100GB free."
          }

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: third_party/depot_tools
          key: ${{ runner.os }}-depot-tools

      - name: Cache Chromium checkout
        uses: actions/cache@v4
        with:
          path: chromium/src
          key: ${{ runner.os }}-chromium-src-${{ hashFiles('scripts/chromium-bootstrap.sh') }}
          restore-keys: |
            ${{ runner.os }}-chromium-src-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            chromium/src/out/astra_Debug
            chromium/src/out/astra_Release
          key: ${{ runner.os }}-chromium-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-chromium-build-

      - name: Bootstrap Chromium (Git Bash)
        shell: bash
        run: |
          chmod +x scripts/chromium-bootstrap.sh
          ./scripts/chromium-bootstrap.sh --no-sync

      - name: Sync Astra overlay (Git Bash)
        shell: bash
        run: |
          chmod +x scripts/sync-overlay.sh
          ./scripts/sync-overlay.sh

      - name: Apply Astra patches (Git Bash)
        shell: bash
        run: |
          chmod +x scripts/apply-patches.sh
          ./scripts/apply-patches.sh --list
          ./scripts/apply-patches.sh || echo "Note: Patch application may have issues on Windows — verify manually"

      - name: Build Astra Chromium (Debug)
        shell: bash
        run: |
          chmod +x scripts/build-astra.sh
          # Use NUMBER_OF_PROCESSORS env var (Windows) or fall back to 4
          JOBS=${NUMBER_OF_PROCESSORS:-4}
          ./scripts/build-astra.sh --target chrome --jobs "$JOBS"

      - name: Run unit tests (Git Bash)
        shell: bash
        run: |
          cd chromium/src
          if command -v autoninja >/dev/null 2>&1; then
            autoninja -C out/astra_Debug astra_unittests
            ./out/astra_Debug/astra_unittests.exe || echo "Note: Some test failures may be expected in CI"
          else
            echo "autoninja not available — skipping tests"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-chromium-debug-windows
          path: |
            chromium/src/out/astra_Debug/chrome.exe
            chromium/src/out/astra_Debug/*.dll
          if-no-files-found: ignore
          retention-days: 7
